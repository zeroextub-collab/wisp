# WISP build system.
#
# Declares the isolated-build requirements so `pip install -e .` works
# out of the box (PEP 517 builds run in a clean env that would otherwise
# lack pybind11/cmake/ninja). Package metadata stays in setup.py because
# the CMake extension build needs its imperative hooks.

[build-system]
requires = [
    "setuptools>=64",
    "wheel",
    "pybind11>=2.11",
    "cmake>=3.20",
    "ninja; platform_system != 'Windows'",
]
build-backend = "setuptools.build_meta"

# NOTE: package metadata — name, version, extras ([server], [gui]) and
# entry points (wisp, wisp-gui) — lives in setup.py, because the CMake
# extension build needs its imperative hooks. A [project] table here
# would have to duplicate all of it, and a PARTIAL one is invalid PEP
# 621: setuptools rejects a [project] table without name/version, so
# adding just [project.optional-dependencies] or [project.scripts]
# breaks the build outright.

[tool.pytest.ini_options]
markers = [
    "engine: requires the compiled C extension (wisp._wisp_core); deselect with -m 'not engine' where the engine may be absent, e.g. CI runners",
]
